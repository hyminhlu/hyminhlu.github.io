<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Trắc Nghiệm Toán 9 - Chương I</title>
    <style>
        :root { --bg: #0f0c29; --primary: #ffcc00; --text: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(to right, #302b63, #0f0c29); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        #game-container { width: 100%; max-width: 600px; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: var(--primary); }
        .option { background: #1a1a2e; border: 2px solid var(--primary); color: white; padding: 15px; margin: 10px 0; border-radius: 8px; cursor: pointer; transition: 0.3s; width: 100%; box-sizing: border-box; }
        .option:hover { background: var(--primary); color: black; }
        #explanation { margin-top: 20px; padding: 15px; background: rgba(255,255,255,0.05); border-left: 5px solid #ffcc00; display: none; }
    </style>
</head>
<body>

<div id="game-container">
    <h2>Chương I: Phương trình & Hệ phương trình</h2>
    <div id="question-box"></div>
    <div id="options-box"></div>
    <div id="explanation"></div>
</div>

<script>
const quizData = [
    { q: "Phương trình bậc nhất hai ẩn x, y có dạng nào?", a: ["ax + by = c", "ax² + by = c", "ax + by² = c", "ax² + by² = c"], correct: 0, exp: "Phương trình bậc nhất hai ẩn có dạng ax + by = c, trong đó a, b không đồng thời bằng 0." },
    { q: "Hệ phương trình bậc nhất hai ẩn có bao nhiêu nghiệm nếu hai đường thẳng song song?", a: ["Một nghiệm", "Vô số nghiệm", "Vô nghiệm", "Hai nghiệm"], correct: 2, exp: "Khi hai đường thẳng song song, chúng không có điểm chung, hệ phương trình vô nghiệm." },
    { q: "Nghiệm của hệ x + y = 3 và x - y = 1 là?", a: ["(1, 2)", "(2, 1)", "(3, 0)", "(0, 3)"], correct: 1, exp: "Cộng vế với vế: 2x = 4 => x = 2. Thay x=2 vào x+y=3 => y=1." },
    { q: "Phương trình 2x + 0y = 4 tương đương với?", a: ["x = 4", "x = 2", "x = 0", "y = 2"], correct: 1, exp: "2x = 4 => x = 4/2 = 2." },
    { q: "Một hệ phương trình bậc nhất hai ẩn có vô số nghiệm khi nào?", a: ["Hai đường thẳng song song", "Hai đường thẳng trùng nhau", "Hai đường thẳng cắt nhau", "Hai đường thẳng vuông góc"], correct: 1, exp: "Khi hai đường thẳng trùng nhau, mọi điểm trên đường thẳng đều là nghiệm." },
    { q: "Cặp số (1; -1) là nghiệm của phương trình nào?", a: ["x + y = 2", "x - y = 0", "x + y = 0", "x - y = 1"], correct: 2, exp: "Thay x=1, y=-1 vào: 1 + (-1) = 0 (thỏa mãn)." },
    { q: "Giải hệ: x = 2y và x + y = 6. Nghiệm là?", a: ["(2, 4)", "(4, 2)", "(3, 3)", "(1, 5)"], correct: 1, exp: "Thay x=2y vào x+y=6 => 3y=6 => y=2 => x=4." },
    { q: "Hệ phương trình ax+by=c và a'x+b'y=c' có nghiệm duy nhất khi nào?", a: ["a/a' = b/b'", "a/a' ≠ b/b'", "a/a' = b/b' ≠ c/c'", "a=a', b=b'"], correct: 1, exp: "Điều kiện để hệ có nghiệm duy nhất là tỉ lệ các hệ số của x và y khác nhau." },
    { q: "Phương trình 0x + 5y = 10 có nghiệm là?", a: ["y = 5", "x = 2", "y = 2", "x = 0"], correct: 2, exp: "5y = 10 => y = 10/5 = 2." },
    { q: "Khi giải hệ bằng phương pháp thế, ta rút một ẩn từ một phương trình rồi?", a: ["Cộng vào phương trình kia", "Nhân vào phương trình kia", "Thay vào phương trình kia", "Chia cho phương trình kia"], correct: 2, exp: "Phương pháp thế là rút ẩn này theo ẩn kia rồi thế vào phương trình còn lại." },
    { q: "Hệ phương trình x+y=2 và x+y=3 có bao nhiêu nghiệm?", a: ["1", "2", "Vô số", "Vô nghiệm"], correct: 3, exp: "Hai đường thẳng này song song với nhau (x+y=2 và x+y=3) nên hệ vô nghiệm." },
    { q: "Với x=1, y=2, giá trị của biểu thức 3x - y là?", a: ["1", "2", "3", "4"], correct: 0, exp: "3(1) - 2 = 3 - 2 = 1." }
];

let currentQ = 0;
function loadQuestion() {
    const qData = quizData[currentQ];
    document.getElementById('question-box').innerHTML = `<h3>Câu ${currentQ + 1}: ${qData.q}</h3>`;
    const box = document.getElementById('options-box');
    box.innerHTML = '';
    qData.a.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(i);
        box.appendChild(btn);
    });
    document.getElementById('explanation').style.display = 'none';
}
function checkAnswer(idx) {
    const expDiv = document.getElementById('explanation');
    expDiv.style.display = 'block';
    const isCorrect = idx === quizData[currentQ].correct;
    expDiv.innerHTML = `<strong>${isCorrect ? 'Chính xác!' : 'Chưa đúng!'}</strong><br>${quizData[currentQ].exp}<br><br>
        <button onclick="next()" style="padding:10px; cursor:pointer;">${currentQ === quizData.length - 1 ? 'Kết thúc' : 'Câu tiếp theo'}</button>`;
}
function next() {
    currentQ++;
    if(currentQ < quizData.length) loadQuestion();
    else { document.body.innerHTML = '<h2>Chúc mừng bạn đã hoàn thành bài kiểm tra!</h2><button onclick="location.reload()">Chơi lại</button>'; }
}
loadQuestion();
</script>
</body>
</html>
