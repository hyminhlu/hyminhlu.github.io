<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Trắc Nghiệm Toán 9 - Chương II</title>
    <style>
        :root { --bg: #2c3e50; --primary: #27ae60; --text: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        #game-container { width: 100%; max-width: 600px; background: #34495e; padding: 20px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: var(--primary); }
        .option { background: #2c3e50; border: 2px solid var(--primary); color: white; padding: 15px; margin: 10px 0; border-radius: 8px; cursor: pointer; transition: 0.2s; width: 100%; box-sizing: border-box; }
        .option:hover { background: var(--primary); }
        #explanation { margin-top: 20px; padding: 15px; background: #2c3e50; border-left: 5px solid #27ae60; display: none; }
    </style>
</head>
<body>

<div id="game-container">
    <h2>Chương II: Phương trình & Bất phương trình bậc nhất một ẩn</h2>
    <div id="question-box"></div>
    <div id="options-box"></div>
    <div id="explanation"></div>
</div>

<script>
const quizData = [
    { q: "Phương trình bậc nhất một ẩn có dạng nào?", a: ["ax + b = 0 (a ≠ 0)", "ax² + b = 0", "ax + b > 0", "ax + by = c"], correct: 0, exp: "Phương trình bậc nhất một ẩn có dạng ax + b = 0 với a khác 0." },
    { q: "Nghiệm của phương trình 2x - 4 = 0 là?", a: ["x = 1", "x = 2", "x = -2", "x = 4"], correct: 1, exp: "2x = 4 => x = 2." },
    { q: "Khi nhân hai vế của bất phương trình với một số âm, ta phải?", a: ["Giữ nguyên chiều", "Đổi chiều bất phương trình", "Cộng thêm số đó", "Bỏ qua"], correct: 1, exp: "Đây là quy tắc cơ bản: nhân/chia với số âm thì đổi chiều bất phương trình." },
    { q: "Bất phương trình x + 3 > 5 có tập nghiệm là?", a: ["x > 2", "x < 2", "x > 8", "x < 8"], correct: 0, exp: "x > 5 - 3 => x > 2." },
    { q: "Phương trình nào sau đây là phương trình bậc nhất một ẩn?", a: ["0x + 5 = 0", "2x + 1 = 0", "x² - 1 = 0", "2x + y = 3"], correct: 1, exp: "Chỉ có 2x + 1 = 0 thỏa mãn dạng ax + b = 0 với a ≠ 0." },
    { q: "Nghiệm của bất phương trình -2x < 6 là?", a: ["x < -3", "x > -3", "x < 3", "x > 3"], correct: 1, exp: "Chia hai vế cho -2 và đổi chiều: x > -3." },
    { q: "Điều kiện để phương trình ax + b = 0 có nghiệm duy nhất?", a: ["a > 0", "a < 0", "a ≠ 0", "b ≠ 0"], correct: 2, exp: "Với a ≠ 0, phương trình luôn có nghiệm duy nhất x = -b/a." },
    { q: "Giá trị x = 3 là nghiệm của bất phương trình nào?", a: ["x + 2 > 6", "2x - 1 < 4", "3x - 5 > 2", "x + 1 < 2"], correct: 2, exp: "Thay x=3 vào: 3(3) - 5 = 4 > 2 (đúng)." },
    { q: "Bất phương trình bậc nhất một ẩn có dạng nào?", a: ["ax + b < 0", "ax + b ≤ 0", "ax + b > 0", "Tất cả đều đúng"], correct: 3, exp: "Bất phương trình bậc nhất một ẩn có thể chứa các dấu <, >, ≤, ≥." },
    { q: "Nghiệm của phương trình 3(x - 1) = 0 là?", a: ["x = 0", "x = 1", "x = 3", "x = -1"], correct: 1, exp: "x - 1 = 0 => x = 1." },
    { q: "Số nào sau đây không là nghiệm của bất phương trình x + 2 < 5?", a: ["1", "2", "3", "4"], correct: 3, exp: "x < 3. Số 4 không nhỏ hơn 3." },
    { q: "Giải phương trình 5 - x = 2x + 2, ta được x bằng?", a: ["1", "3", "2", "-1"], correct: 0, exp: "3 = 3x => x = 1." }
];

let currentQ = 0;
function loadQuestion() {
    const qData = quizData[currentQ];
    document.getElementById('question-box').innerHTML = `<h3>Câu ${currentQ + 1}: ${qData.q}</h3>`;
    const box = document.getElementById('options-box');
    box.innerHTML = '';
    qData.a.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(i);
        box.appendChild(btn);
    });
    document.getElementById('explanation').style.display = 'none';
}
function checkAnswer(idx) {
    const expDiv = document.getElementById('explanation');
    expDiv.style.display = 'block';
    const isCorrect = idx === quizData[currentQ].correct;
    expDiv.innerHTML = `<strong>${isCorrect ? 'Tuyệt vời!' : 'Chưa đúng rồi!'}</strong><br>${quizData[currentQ].exp}<br><br>
        <button onclick="next()" style="padding:10px; cursor:pointer;">${currentQ === quizData.length - 1 ? 'Kết thúc' : 'Câu tiếp theo'}</button>`;
}
function next() {
    currentQ++;
    if(currentQ < quizData.length) loadQuestion();
    else { document.body.innerHTML = '<h2>Hoàn thành chương II! Bạn đã rất tiến bộ!</h2><button onclick="location.reload()">Chơi lại</button>'; }
}
loadQuestion();
</script>
</body>
</html>
