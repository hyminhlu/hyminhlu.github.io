<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Trắc Nghiệm Toán 9 - Bộ 2</title>
    <style>
        :root { --bg: #1b1b2f; --primary: #e94560; --text: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        #game-container { width: 100%; max-width: 600px; background: #0f3460; padding: 20px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: var(--primary); }
        .option { background: #16213e; border: 2px solid var(--primary); color: white; padding: 15px; margin: 10px 0; border-radius: 8px; cursor: pointer; transition: 0.2s; width: 100%; box-sizing: border-box; }
        .option:hover { background: var(--primary); }
        #explanation { margin-top: 20px; padding: 15px; background: #1a1a2e; border-left: 5px solid #e94560; display: none; }
    </style>
</head>
<body>

<div id="game-container">
    <h2>Chương I: Phương trình & Hệ phương trình</h2>
    <div id="question-box"></div>
    <div id="options-box"></div>
    <div id="explanation"></div>
</div>

<script>
const quizData = [
    { q: "Hệ phương trình x+y=5 và 2x-y=1 có nghiệm là?", a: ["(2, 3)", "(3, 2)", "(1, 4)", "(4, 1)"], correct: 0, exp: "Cộng vế với vế: 3x = 6 => x=2. Thay vào x+y=5 => y=3." },
    { q: "Đường thẳng y = ax + b là đồ thị của phương trình nào?", a: ["Phương trình bậc nhất 1 ẩn", "Phương trình bậc nhất 2 ẩn", "Phương trình bậc hai", "Hệ phương trình"], correct: 1, exp: "Mỗi phương trình bậc nhất hai ẩn có thể biểu diễn dưới dạng một đường thẳng trên mặt phẳng tọa độ." },
    { q: "Khi nào hệ phương trình bậc nhất hai ẩn có vô số nghiệm?", a: ["Các đường thẳng cắt nhau", "Các đường thẳng song song", "Các đường thẳng trùng nhau", "Các đường thẳng vuông góc"], correct: 2, exp: "Khi hai đường thẳng trùng nhau, mọi điểm trên đường thẳng đều thỏa mãn cả hai phương trình." },
    { q: "Nghiệm của hệ x - y = 0 và x + y = 4 là?", a: ["(1, 3)", "(3, 1)", "(2, 2)", "(4, 0)"], correct: 2, exp: "Cộng vế với vế: 2x = 4 => x=2. Trừ vế với vế: 2y = 4 => y=2." },
    { q: "Phương trình 3x - 2y = 5 có bao nhiêu nghiệm?", a: ["1 nghiệm", "2 nghiệm", "Không có nghiệm", "Vô số nghiệm"], correct: 3, exp: "Phương trình bậc nhất hai ẩn ax+by=c (với a, b khác 0) luôn có vô số nghiệm." },
    { q: "Cặp số (x; y) nào là nghiệm của hệ x+2y=4 và 2x-y=3?", a: ["(2, 1)", "(1, 2)", "(3, 3)", "(0, 2)"], correct: 0, exp: "Thay x=2, y=1 vào: 2+2(1)=4 (đúng) và 2(2)-1=3 (đúng)." },
    { q: "Điều kiện để đường thẳng ax+by=c song song với a'x+b'y=c' là?", a: ["a/a' = b/b' ≠ c/c'", "a/a' ≠ b/b'", "a/a' = b/b' = c/c'", "a=a', b=b'"], correct: 0, exp: "Hai đường thẳng song song khi tỉ lệ hệ số x và y bằng nhau nhưng khác tỉ lệ hệ số tự do." },
    { q: "Giải hệ 2x=4 và 3y=9 ta được nghiệm là?", a: ["(4, 9)", "(2, 3)", "(3, 2)", "(1, 1)"], correct: 1, exp: "x = 4/2 = 2 và y = 9/3 = 3." },
    { q: "Để khử ẩn x trong hệ phương trình, ta thường dùng phương pháp?", a: ["Thế", "Cộng đại số", "Vẽ đồ thị", "Đo đạc"], correct: 1, exp: "Phương pháp cộng đại số giúp triệt tiêu một ẩn để đưa về phương trình một ẩn." },
    { q: "Phương trình 0x + 0y = 5 có bao nhiêu nghiệm?", a: ["0", "1", "2", "Vô số"], correct: 0, exp: "Vì 0 = 5 là vô lý nên phương trình này vô nghiệm." },
    { q: "Hệ phương trình bậc nhất hai ẩn có thể giải bằng mấy cách chính?", a: ["1", "2", "3", "4"], correct: 2, exp: "Các cách chính là: Phương pháp thế, phương pháp cộng đại số và phương pháp vẽ đồ thị." },
    { q: "Cho x=3, y=1, giá trị của hệ thức 2x+y là?", a: ["5", "6", "7", "8"], correct: 2, exp: "2(3) + 1 = 6 + 1 = 7." }
];

let currentQ = 0;
function loadQuestion() {
    const qData = quizData[currentQ];
    document.getElementById('question-box').innerHTML = `<h3>Câu ${currentQ + 1}: ${qData.q}</h3>`;
    const box = document.getElementById('options-box');
    box.innerHTML = '';
    qData.a.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(i);
        box.appendChild(btn);
    });
    document.getElementById('explanation').style.display = 'none';
}
function checkAnswer(idx) {
    const expDiv = document.getElementById('explanation');
    expDiv.style.display = 'block';
    const isCorrect = idx === quizData[currentQ].correct;
    expDiv.innerHTML = `<strong>${isCorrect ? 'Tuyệt vời!' : 'Chưa chính xác!'}</strong><br>${quizData[currentQ].exp}<br><br>
        <button onclick="next()" style="padding:10px; cursor:pointer;">${currentQ === quizData.length - 1 ? 'Hoàn thành' : 'Câu tiếp theo'}</button>`;
}
function next() {
    currentQ++;
    if(currentQ < quizData.length) loadQuestion();
    else { document.body.innerHTML = '<h2>Bạn đã xuất sắc vượt qua bộ đề 02!</h2><button onclick="location.reload()">Chơi lại từ đầu</button>'; }
}
loadQuestion();
</script>
</body>
</html>
