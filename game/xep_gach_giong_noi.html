<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Controlled Tetris (English Version)</title>
    <style>
        body {
            background: #202028;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1.8em;
            text-align: center;
            margin-top: 20px;
        }
        canvas {
            border: solid 4px #444;
            background-color: #111;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #score {
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 10px;
        }
        .info-box {
            font-size: 0.5em;
            color: #bbb;
            margin-top: 10px;
            background: #2a2a35;
            display: inline-block;
            padding: 10px 20px;
            border-radius: 8px;
            min-width: 300px;
        }
        #command {
            color: #00ffcc;
            font-weight: bold;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div>VOICE TETRIS</div>
    <div id="score">Score: 0</div>
    <canvas id="tetris" width="240" height="400"></canvas>
    
    <br>
    <div class="info-box">
        <div id="mic-status" style="color: yellow;">👉 CLICK ANYWHERE TO START MIC 👈</div>
        <div style="margin-top: 5px;">Say: <span style="color:#ff6666">"Left"</span> | <span style="color:#66ff66">"Right"</span> | <span style="color:#66ccff">"Rotate"</span> | <span style="color:#cc66ff">"Down"</span></div>
        <hr style="border-color: #444; margin: 8px 0;">
        <div>AI Heard: <span id="command">None</span></div>
    </div>

    <script>
        // --- 1. TETRIS GAME LOGIC (STANDARD) ---
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        context.scale(20, 20);

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) continue outer;
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;
                player.score += rowCount * 10;
                rowCount *= 2;
            }
            updateScore();
        }

        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) matrix.push(new Array(w).fill(0));
            return matrix;
        }

        function createPiece(type) {
            if (type === 'T') return [[0, 0, 0], [1, 1, 1], [0, 1, 0]];
            else if (type === 'O') return [[2, 2], [2, 2]];
            else if (type === 'L') return [[0, 3, 0], [0, 3, 0], [0, 3, 3]];
            else if (type === 'J') return [[0, 4, 0], [0, 4, 0], [4, 4, 0]];
            else if (type === 'I') return [[0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0]];
            else if (type === 'S') return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
            else if (type === 'Z') return [[7, 7, 0], [0, 7, 7], [0, 0, 0]];
        }

        function drawMatrix(matrix, offset) {
            const colors = [null, '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'];
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = colors[value];
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        function draw() {
            context.fillStyle = '#111';
            context.fillRect(0, 0, canvas.width, canvas.height);
            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
                });
            });
        }

        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) player.pos.x -= dir;
        }

        function playerReset() {
            const pieces = 'ILJOTSZ';
            player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
            if (collide(arena, player)) {
                arena.forEach(row => row.fill(0));
                player.score = 0;
                updateScore();
            }
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
            }
            dropCounter = 0;
        }

        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) matrix.forEach(row => row.reverse());
            else matrix.reverse();
        }

        let dropCounter = 0;
        let dropInterval = 1500; // Tăng thời gian rơi lên 1.5 giây để người chơi kịp nói
        let lastTime = 0;

        function update(time = 0) {
            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;
            if (dropCounter > dropInterval) playerDrop();
            draw();
            requestAnimationFrame(update);
        }

        function updateScore() {
            document.getElementById('score').innerText = "Score: " + player.score;
        }

        const arena = createMatrix(12, 20);
        const player = { pos: {x: 0, y: 0}, matrix: null, score: 0 };

        playerReset();
        updateScore();
        update();


        // --- 2. ENGLISH VOICE RECOGNITION AI ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const micStatus = document.getElementById('mic-status');
        const commandDisplay = document.getElementById('command');

        if (!SpeechRecognition) {
            micStatus.innerText = "Browser not supported. Please use Chrome or Edge.";
            micStatus.style.color = "red";
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US'; // Chuyển sang Tiếng Anh
            recognition.continuous = true;
            recognition.interimResults = true; // Nhận diện siêu tốc khi đang nói

            recognition.onstart = () => {
                micStatus.innerText = "🎙️ Listening... Speak clearly!";
                micStatus.style.color = "#00ff00";
            };

            recognition.onerror = (event) => {
                console.error(event.error);
                if (event.error === 'not-allowed') {
                    micStatus.innerText = "❌ Mic Blocked! Allow mic in browser settings.";
                    micStatus.style.color = "red";
                }
            };

            recognition.onend = () => {
                try { recognition.start(); } catch(e) {} // Giữ mic luôn bật
            };

            recognition.onresult = (event) => {
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    let text = event.results[i][0].transcript.toLowerCase().trim();
                    commandDisplay.innerText = text;

                    // Xử lý khẩu lệnh tiếng Anh (Dùng includes đề phòng AI nghe kèm từ thừa)
                    if (text.includes('left')) {
                        playerMove(-1);
                        clearTextDelay();
                    } 
                    else if (text.includes('right')) {
                        playerMove(1);
                        clearTextDelay();
                    } 
                    else if (text.includes('rotate') || text.includes('turn')) {
                        playerRotate(1);
                        clearTextDelay();
                    } 
                    else if (text.includes('down') || text.includes('drop')) {
                        playerDrop();
                        clearTextDelay();
                    }
                }
            };

            let clearTimer;
            function clearTextDelay() {
                clearTimeout(clearTimer);
                clearTimer = setTimeout(() => {
                    commandDisplay.innerText = "...";
                }, 600);
            }

            // Kích hoạt khi click vào màn hình (Bắt buộc theo luật bảo mật của Chrome)
            window.addEventListener('click', () => {
                try { recognition.start(); } catch(e) {}
            });
        }
    </script>
</body>
</html>
