<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Điều Khiển Bằng Giọng Nói</title>
    <style>
        body {
            background: #202028;
            color: #fff;
            font-family: sans-serif;
            font-size: 2em;
            text-align: center;
        }
        canvas {
            border: solid 2px #fff;
            background-color: #000;
        }
        #status {
            font-size: 0.5em;
            color: #888;
            margin-top: 10px;
        }
        #command {
            color: #00ffcc;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div>TETRIS GIỌNG NÓI</div>
    <div id="score">Điểm: 0</div>
    <canvas id="tetris" width="240" height="400"></canvas>
    <div id="status">Trạng thái micro: <span id="mic-status">Đang thiết lập...</span></div>
    <div id="status">Lệnh vừa nhận: <span id="command">Chưa có</span></div>

    <script>
        // --- 1. KHỞI TẠO GAME TETRIS ---
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        context.scale(20, 20); // Phóng to các ô vuông (12x20 ô)

        // Xóa hàng khi đầy
        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        continue outer;
                    }
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;
                player.score += rowCount * 10;
                rowCount *= 2;
            }
            updateScore();
        }

        // Kiểm tra va chạm
        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (arena[y + o.y] &&
                        arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        // Tạo bàn cờ
        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        // Tạo các loại gạch
        function createPiece(type) {
            if (type === 'T') {
                return [[0, 0, 0], [1, 1, 1], [0, 1, 0]];
            } else if (type === 'O') {
                return [[2, 2], [2, 2]];
            } else if (type === 'L') {
                return [[0, 3, 0], [0, 3, 0], [0, 3, 3]];
            } else if (type === 'J') {
                return [[0, 4, 0], [0, 4, 0], [4, 4, 0]];
            } else if (type === 'I') {
                return [[0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0]];
            } else if (type === 'S') {
                return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
            } else if (type === 'Z') {
                return [[7, 7, 0], [0, 7, 7], [0, 0, 0]];
            }
        }

        // Vẽ ma trận (bàn cờ hoặc viên gạch)
        function drawMatrix(matrix, offset) {
            const colors = [null, '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'];
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = colors[value];
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        function draw() {
            context.fillStyle = '#000';
            context.fillRect(0, 0, canvas.width, canvas.height);
            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        // Gom gạch lại khi chạm đáy
        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        // Hàm di chuyển gạch
        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) {
                player.pos.x -= dir;
            }
        }

        // Reset khi thua hoặc đổi gạch mới
        function playerReset() {
            const pieces = 'ILJOTSZ';
            player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
            if (collide(arena, player)) {
                arena.forEach(row => row.fill(0));
                player.score = 0;
                updateScore();
            }
        }

        // Hàm rơi tự động (giữ nguyên để game có độ khó tăng dần)
        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
            }
            dropCounter = 0;
        }

        // Xoay gạch
        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) matrix.forEach(row => row.reverse());
            else matrix.reverse();
        }

        let dropCounter = 0;
        let dropInterval = 1000; // Tốc độ rơi tự động (1 giây)
        let lastTime = 0;

        function update(time = 0) {
            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                playerDrop();
            }
            draw();
            requestAnimationFrame(update);
        }

        function updateScore() {
            document.getElementById('score').innerText = "Điểm: " + player.score;
        }

        const arena = createMatrix(12, 20);
        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            score: 0,
        };

        playerReset();
        updateScore();
        update();


        // --- 2. TÍCH HỢP AI NHẬN DIỆN GIỌNG NÓI ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const micStatus = document.getElementById('mic-status');
        const commandDisplay = document.getElementById('command');

        if (!SpeechRecognition) {
            micStatus.innerText = "Trình duyệt của bạn không hỗ trợ nhận diện giọng nói. Hãy dùng Chrome hoặc Edge.";
            micStatus.style.color = "red";
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'vi-VN'; // Đặt ngôn ngữ là Tiếng Việt
            recognition.continuous = true; // Nhận diện liên tục không ngắt quãng
            recognition.interimResults = true; // Nhận diện cả kết quả tạm thời để phản hồi nhanh hơn

            recognition.onstart = () => {
                micStatus.innerText = "Đang lắng nghe... Hãy nói 'Trái', 'Phải' hoặc 'Xoay'";
                micStatus.style.color = "#00ff00";
            };

            recognition.onerror = (event) => {
                console.error("Lỗi Micro: ", event.error);
                if(event.error === 'not-allowed') {
                    micStatus.innerText = "Lỗi: Hãy cấp quyền mở Micro cho trang web!";
                    micStatus.style.color = "red";
                }
            };

            recognition.onend = () => {
                // Tự động bật lại mic nếu bị ngắt kết nối giữa chừng
                recognition.start();
            };

            recognition.onresult = (event) => {
                let finalTranscript = '';
                
                // Lấy từ khóa mới nhất được nói ra
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        // Thử lấy kết quả tạm thời để xử lý nhanh hơn (tùy chọn)
                        let text = event.results[i][0].transcript.toLowerCase().trim();
                        handleVoiceCommand(text);
                    }
                }

                if (finalTranscript !== '') {
                    handleVoiceCommand(finalTranscript.toLowerCase().trim());
                }
            };

            // Hàm xử lý khẩu lệnh và ánh xạ vào game
            function handleVoiceCommand(text) {
                // Hiển thị những gì AI nghe được lên màn hình để tiện debug
                commandDisplay.innerText = text;

                // Sử dụng "includes" để nhận diện chính chính xác hơn ngay cả khi có từ thừa (ví dụ: "qua trái", "xoay gạch")
                if (text.includes('trái') || text.includes('dái') || text.includes('tái')) {
                    playerMove(-1);
                    clearTextDelay();
                } 
                else if (text.includes('phải') || text.includes('bải') || text.includes('hải')) {
                    playerMove(1);
                    clearTextDelay();
                } 
                else if (text.includes('xoay') || text.includes('xoai') || text.includes('soay')) {
                    playerRotate(1);
                    clearTextDelay();
                }
                else if (text.includes('xuống') || text.includes('xuông')) {
                    playerDrop();
                    clearTextDelay();
                }
            }

            let clearTimer;
            function clearTextDelay() {
                clearTimeout(clearTimer);
                clearTimer = setTimeout(() => {
                    commandDisplay.innerText = "Chờ lệnh...";
                }, 800);
            }

            // Kích hoạt Micro ngay khi tải trang
            // Lưu ý: Chrome yêu cầu người dùng phải tương tác tương tác (click) vào trang web trước khi mở mic.
            window.addEventListener('click', () => {
                try {
                    recognition.start();
                } catch(e) {
                    // Tránh lỗi nếu đã start rồi
                }
            });
        }
    </script>
</body>
</html>
