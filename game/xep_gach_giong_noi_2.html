<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris AI - Voice Control Edition</title>
    <style>
        body {
            background: #1a1a2e;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            border: 4px solid #0f3460;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
        }
        canvas {
            background-color: #000;
            display: block;
        }
        .ui-panel {
            text-align: center;
            margin-bottom: 15px;
        }
        #score {
            font-size: 2em;
            color: #e94560;
            text-shadow: 2px 2px #000;
        }
        .status-box {
            background: #16213e;
            padding: 10px 20px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 0.9em;
            width: 300px;
            border: 1px solid #0f3460;
        }
        #command-active {
            font-size: 1.5em;
            color: #00d2ff;
            font-weight: bold;
            display: block;
            margin-top: 5px;
            height: 1.6em;
        }
        #mic-indicator {
            color: yellow;
            font-weight: bold;
        }
        .hint {
            font-size: 0.8em;
            color: #888;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="ui-panel">
        <div style="font-size: 1.5em; letter-spacing: 5px;">VOICE TETRIS AI</div>
        <div id="score">Score: 0</div>
    </div>

    <div id="game-container">
        <canvas id="tetris" width="240" height="400"></canvas>
    </div>

    <div class="status-box">
        <div>AI Status: <span id="mic-indicator">WAITING FOR CLICK...</span></div>
        <div>Last Command: <span id="command-active">-</span></div>
        <div class="hint">Commands: [Left] [Right] [Down] [Rotate]</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/@teachablemachine/audio@0.4/dist/teachablemachine-audio.min.js"></script>

    <script>
        // --- 1. CẤU HÌNH AI TỪ LINK CỦA BẠN ---
        const URL = "https://teachablemachine.withgoogle.com/models/2bC3PF3dW/";
        let recognizer;

        async function initAI() {
            const checkpointURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            document.getElementById('mic-indicator').innerText = "LOADING MODEL...";
            
            recognizer = speechCommands.create(
                "BROWSER_FFT",
                undefined,
                checkpointURL,
                metadataURL
            );

            await recognizer.ensureModelLoaded();
            
            document.getElementById('mic-indicator').innerText = "🎙️ LISTENING...";
            document.getElementById('mic-indicator').style.color = "#00ff00";

            const classLabels = recognizer.wordLabels(); 

            recognizer.listen(result => {
                let maxProb = 0;
                let bestAction = "";

                for (let i = 0; i < classLabels.length; i++) {
                    if (result.scores[i] > maxProb) {
                        maxProb = result.scores[i];
                        bestAction = classLabels[i];
                    }
                }

                // Xử lý khi AI nhận diện chính xác trên 80%
                if (maxProb > 0.80 && bestAction !== "Background Noise") {
                    handleCommand(bestAction);
                }
            }, {
                includeSpectrogram: true,
                probabilityThreshold: 0.75,
                invokeCallbackOnNoiseAndUnknown: false,
                overlapFactor: 0.5
            });
        }

        function handleCommand(cmd) {
            const display = document.getElementById('command-active');
            display.innerText = cmd.toUpperCase();
            
            if (cmd === 'left') playerMove(-1);
            else if (cmd === 'right') playerMove(1);
            else if (cmd === 'rotate') playerRotate(1);
            else if (cmd === 'down') playerDrop();

            // Xóa chữ hiển thị sau 500ms
            setTimeout(() => { if(display.innerText === cmd.toUpperCase()) display.innerText = "-"; }, 500);
        }

        // --- 2. LOGIC GAME TETRIS ---
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        context.scale(20, 20);

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) continue outer;
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;
                player.score += rowCount * 10;
                rowCount *= 2;
            }
            updateScore();
        }

        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function createPiece(type) {
            if (type === 'T') return [[0, 0, 0], [1, 1, 1], [0, 1, 0]];
            if (type === 'O') return [[2, 2], [2, 2]];
            if (type === 'L') return [[0, 3, 0], [0, 3, 0], [0, 3, 3]];
            if (type === 'J') return [[0, 4, 0], [0, 4, 0], [4, 4, 0]];
            if (type === 'I') return [[0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0]];
            if (type === 'S') return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
            if (type === 'Z') return [[7, 7, 0], [0, 7, 7], [0, 0, 0]];
        }

        function draw() {
            context.fillStyle = '#000';
            context.fillRect(0, 0, canvas.width, canvas.height);
            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        function drawMatrix(matrix, offset) {
            const colors = [null, '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'];
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = colors[value];
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
                });
            });
        }

        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) player.pos.x -= dir;
        }

            const pieces = 'ILJOTSZ';
            player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);

            player.pos.
